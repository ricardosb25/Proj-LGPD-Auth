@if (step() === 'email') {
  <div class="recovery-wrapper">
    <div class="recovery-card">
      <form (ngSubmit)="requestRecoveryCode()">
        <h1 class="recovery-title">Recuperar Senha</h1>
        <p class="recovery-subtitle">Digite o e-mail cadastrado e enviaremos instruções para redefinir sua senha.</p>
  
        <div class="input-group">
          <label for="email">E-mail</label>
          <input
            type="email"
            id="email"
            name="email"
            [ngModel]="email()"
            (ngModelChange)="email.set($event)"
            placeholder="seu@email.com"
            required
          />
        </div>

        <span class="error-text" *ngIf="errorMessage()" style="color: #e74c3c; font-size: 0.85rem; text-align: center; display: block; margin-bottom: 0.5rem;">
          {{ errorMessage() }}
        </span>
  
        <button type="submit" class="btn-submit" [disabled]="isLoading() || !email()">
          {{ isLoading() ? 'Enviando...' : 'Enviar Código' }}
        </button>
  
        <div class="back-link">
          <a href="/login">Voltar para o Login</a>
        </div>
      </form>
    </div>
  </div>
}

@if (step() === 'code') {
  <app-two-fa
    title="Código de Recuperação"
    subtitle="Insira o código de 6 dígitos que enviamos para {{ email() }}"
    [isRecoveryMode]="true" 
    (codeSubmitted)="onCodeVerified($event)">
  </app-two-fa>
}

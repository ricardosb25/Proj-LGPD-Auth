<div class="login-wrapper">
  <form class="login-card" (ngSubmit)="onSubmit()">
    <h1 class="login-title">Entrar</h1>

    <div class="input-group">
      <label for="email">E-mail</label>
      <input
        type="email"
        id="email"
        name="email"
        [ngModel]="email()"
        (ngModelChange)="email.set($event)"
        placeholder="seu@email.com"
        required
      />
    </div>

    <div class="input-group">
      <label for="password">Senha</label>
      <input
        type="password"
        id="password"
        name="password"
        [ngModel]="password()"
        (ngModelChange)="password.set($event)"
        placeholder="••••••••"
        required
      />
    </div>
    <span
      class="error-text"
      *ngIf="errorMessage()"
      style="
        color: #e74c3c;
        font-size: 0.85rem;
        text-align: center;
        margin-bottom: 0.5rem;
        display: block;
      "
    >
      {{ errorMessage() }}
    </span>

    <button
      type="submit"
      class="btn-submit"
      [disabled]="isLoading() || !email() || !password()"
    >
      {{ isLoading() ? "Processando..." : "Acessar" }}
    </button>
    <div class="forgot-section">
      <a href="/password-recovery" class="forgot-link">Esqueci minha senha</a>
    </div>
    <div class="sign-in-section">
      <span class="sign-in-text">Não tem uma conta?</span>
      <a href="/sign-in" class="sign-in-link">Cadastre-se</a>
    </div>
  </form>
</div>

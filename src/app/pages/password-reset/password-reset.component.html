<div class="reset-wrapper">
  <form class="reset-card" (ngSubmit)="onSubmit()">
    <h1 class="reset-title">Criar Nova Senha</h1>
    <p class="reset-subtitle">
      Sua nova senha deve ser diferente das senhas usadas anteriormente.
    </p>

    <div class="input-group">
      <label for="password">Nova Senha</label>
      <input
        type="password"
        id="password"
        name="password"
        [ngModel]="password()"
        (ngModelChange)="password.set($event)"
        placeholder="Mínimo de 6 caracteres"
        minlength="6"
        required
      />
    </div>

    <div class="input-group">
      <label for="confirmPassword">Confirmar Nova Senha</label>
      <input
        type="password"
        id="confirmPassword"
        name="confirmPassword"
        [ngModel]="confirmPassword()"
        (ngModelChange)="confirmPassword.set($event)"
        placeholder="Repita a nova senha"
        [class.input-error]="!passwordsMatch()"
        required
      />
    </div>

    <span class="error-text" *ngIf="!passwordsMatch()">
      As senhas não coincidem.
    </span>

    <span
      class="error-text"
      *ngIf="errorMessage()"
      style="
        color: #e74c3c;
        font-size: 0.85rem;
        text-align: center;
        display: block;
        margin-bottom: 1rem;
      "
    >
      {{ errorMessage() }}
    </span>

    <button
      type="submit"
      class="btn-submit"
      [disabled]="isLoading() || !isFormValid()"
    >
      {{ isLoading() ? "Redefinindo..." : "Redefinir Senha" }}
    </button>

    <div class="back-link">
      <a href="/login">Voltar para o Login</a>
    </div>
  </form>
</div>
